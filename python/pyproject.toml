[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcja-soccer"
version = "0.2.0"
description = "Write a robot for the RCJA Soccer Simulation league and MicroPython robots"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# Deliberately empty, and worth keeping that way. See rcja_soccer/_ws.py.
dependencies = []

[project.scripts]
rcja-join = "rcja_soccer.join:main"
rcja-submit = "rcja_soccer.submit:main"

[tool.setuptools.packages.find]
include = ["rcja_soccer*", "machine*"]

[tool.setuptools]
# `utime` and the `u*` aliases are the names a board uses for standard-library
# modules; shipping them means a program written for real hardware imports
# cleanly here. `rcja_soccer_bootstrap` is the startup hook - see its
# docstring, and `sitecustomize.py` for the in-repo equivalent.
py-modules = [
    "join",
    "micropython",
    "rcja_soccer_bootstrap",
    "submit",
    "uasyncio",
    "ubinascii",
    "ucollections",
    "uerrno",
    "uhashlib",
    "uheapq",
    "uio",
    "ujson",
    "uos",
    "urandom",
    "ure",
    "uselect",
    "usocket",
    "ustruct",
    "usys",
    "utime",
    "uzlib",
]
