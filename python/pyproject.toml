[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcja-soccer"
version = "0.1.0"
description = "Write a robot for the RCJA Soccer Simulation league"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# Deliberately empty, and worth keeping that way. See rcja_soccer/_ws.py.
dependencies = []

[tool.setuptools.packages.find]
include = ["rcja_soccer*"]
