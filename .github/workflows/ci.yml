name: CI

on:
  push:
    branches: [main, 'feat/*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (Bubblewrap & Python)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Static checks & typecheck
        run: make check

      - name: Run test suite
        run: bun test

      - name: Build web frontends
        run: make build

      - name: Compile standalone binary
        run: make build-bin
